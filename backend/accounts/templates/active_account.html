<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial; background:#0b0b0b; color:#fff;">
  <div style="max-width:600px;margin:auto;padding:32px;">
    <h2 style="color:#d4af37;">Bienvenue {{ user.email }}</h2>

    <p>Merci de vous être inscrit.</p>

    <p>Veuillez activer votre compte en cliquant sur le bouton ci-dessous :</p>

    <a href="{{ activation_url }}"
       style="display:inline-block;
              margin-top:24px;
              padding:14px 24px;
              background:#d4af37;
              color:#000;
              text-decoration:none;
              font-weight:bold;">
      Activer mon compte
    </a>

    <p style="margin-top:32px;font-size:12px;color:#aaa;">
      Si vous n’êtes pas à l’origine de cette inscription, ignorez cet email.
    </p>
  </div>
</body>
</html>
